<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>パパ吉じゃんけん</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
    <h1>パパ吉じゃんけん</h1>

    <div id="video-stage">
        <video id="papakichi-video" playsinline>
            お使いのブラウザは動画再生に対応していません。
        </video>
        <div id="draw-overlay"></div>
    </div>

    <div id="status-line"></div>

    <div id="controls">
        <div id="hand-buttons">
            <button id="btn-goo" class="janken-btn" data-hand="goo">✊<br>グー</button>
            <button id="btn-choki" class="janken-btn" data-hand="choki">✌️<br>チョキ</button>
            <button id="btn-par" class="janken-btn" data-hand="par">✋<br>パー</button>
        </div>
        <button id="again-btn">もう一度じゃんけんする</button>
    </div>

    <details id="history-section">
        <summary>
            じゃんけん履歴
            <button id="clear-history-btn">履歴を削除</button>
        </summary>
        <div id="history-empty">まだ記録がありません</div>
        <div class="table-scroll">
            <table id="history-table">
                <thead>
                    <tr>
                        <th>日時</th>
                        <th>あなた</th>
                        <th>パパ吉</th>
                        <th>結果</th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </details>
</div>

<script src="app.js"></script>
</body>
</html>
